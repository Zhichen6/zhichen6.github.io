<header class="site-header">
  <div class="wrap-max site-header__inner">
    <a class="site-header__brand" href="{{ '/' | relative_url }}">
      Zhichen Liu
      <span>SBU AI Mobility Lab</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Main">
      <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-nav-menu" aria-label="Toggle menu"><span></span></button>
      <ul id="site-nav-menu">
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} class="is-active" aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
