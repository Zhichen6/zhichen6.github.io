# Newest first is not required — the page sorts by date.
# Items older than 18 months move into the "Earlier news" archive automatically.

- date: 2026-08-24
  body: >-
    Zhanyu Feng and Rui Chen join the lab as Ph.D. students. Welcome to the team!

- date: 2026-08-04
  body: >-
    Charlotte Cain, an undergraduate researcher in the lab, was named
    <a href="https://news.stonybrook.edu/university/ureca-researcher-of-the-month-charlotte-cain-explores-ai-and-education/" target="_blank" rel="noopener">URECA
    Researcher of the Month</a> for her work exploring AI and education.

- date: 2026-07-20
  body: >-
    Dr. Zhichen Liu presented <em>Large-Scale Inverse Learning of User Equilibrium
    via Multiconvex Optimization</em> in a podium session at ISTTT 2026.

- date: 2026-05-20
  body: >-
    Our paper
    <a href="https://www.sciencedirect.com/science/article/pii/S0191261526000755" target="_blank" rel="noopener">Large-scale
    inverse learning of user equilibrium via multiconvex optimization</a>
    is published in <strong>Transportation Research Part B</strong>.

- date: 2026-05-01
  body: >-
    Undergraduate researchers Evelyn Sun and Jacqueline Louie presented at the
    SUNY AI Symposium, hosted at Stony Brook University, on how game-theoretic
    models and large language models can support the safe integration of
    autonomous vehicles into traffic.

- date: 2025-07-26
  body: >-
    Our paper
    <a href="https://pubsonline.informs.org/doi/abs/10.1287/trsc.2023.0489" target="_blank" rel="noopener">End-to-End
    Learning of User Equilibrium: Expressivity, Generalization, and Optimization</a>,
    co-authored with Dr. Yafeng Yin, is published in <strong>Transportation Science</strong>.

- date: 2025-03-11
  body: >-
    Dr. Zhichen Liu was honored as the <strong>sole global recipient</strong> of the
    2025 <strong>Helene M. Overly Memorial Scholarship</strong> ($10,000) from the
    WTS International Foundation.
