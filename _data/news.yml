# Newest first is not required — the page sorts by date.
# Items older than 18 months move into the "Earlier news" archive automatically.

- date: 2026-08-24
  body: >-
    We are delighted to welcome Zhanyu Feng and Rui Chen, who join the lab this
    fall as Ph.D. students.

- date: 2026-08-04
  body: >-
    Congratulations to Charlotte Cain, an undergraduate researcher in the lab,
    who was named
    <a href="https://news.stonybrook.edu/university/ureca-researcher-of-the-month-charlotte-cain-explores-ai-and-education/" target="_blank" rel="noopener">URECA
    Researcher of the Month</a> for her work exploring AI and education. Very well
    deserved.

- date: 2026-07-20
  body: >-
    Dr. Liu presented <em>Large-Scale Inverse Learning of User Equilibrium via
    Multiconvex Optimization</em> in a podium session at ISTTT 2026 — a wonderful
    opportunity to share this work with the community and hear where others are
    taking it.

- date: 2026-05-20
  body: >-
    We are pleased to share that
    <a href="https://www.sciencedirect.com/science/article/pii/S0191261526000755" target="_blank" rel="noopener">Large-scale
    inverse learning of user equilibrium via multiconvex optimization</a>
    is now published in <strong>Transportation Research Part B</strong>.

- date: 2026-05-01
  body: >-
    Congratulations to undergraduate researchers Evelyn Sun and Jacqueline Louie,
    who presented at the SUNY AI Symposium here at Stony Brook on how
    game-theoretic models and large language models can support the safe
    integration of autonomous vehicles into traffic. A terrific first conference
    showing for both.

- date: 2025-07-26
  body: >-
    We are pleased to share that
    <a href="https://pubsonline.informs.org/doi/abs/10.1287/trsc.2023.0489" target="_blank" rel="noopener">End-to-End
    Learning of User Equilibrium: Expressivity, Generalization, and Optimization</a>,
    co-authored with Dr. Yafeng Yin, is now published in
    <strong>Transportation Science</strong>.

- date: 2025-03-11
  body: >-
    Dr. Liu was honored as the sole global recipient of the 2025
    <strong>Helene M. Overly Memorial Scholarship</strong> ($10,000) from the WTS
    International Foundation, recognizing her contributions to research and to the
    community.
